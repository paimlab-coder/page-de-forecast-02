<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADR 07 - Forecast Comercial</title>

<script src="https://cdn.jsdelivr.net/npm/chartstyle>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f9;
color:#333;
}

header{
background:#004A93;
color:white;
padding:60px;
text-align:center;
}

header h1{
font-size:42px;
margin-bottom:10px;
}

header p{
font-size:18px;
opacity:.9;
}

.container{
width:90%;
max-width:1400px;
margin:auto;
}

.section{
padding:60px 0;
}

.title{
font-size:32px;
color:#004A93;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
}

.card h3{
font-size:18px;
margin-bottom:10px;
}

.value{
font-size:42px;
font-weight:bold;
color:#004A93;
}

.green{
color:#1FA95B;
}

.yellow{
color:#F7B500;
}

.red{
color:#D62828;
}

.chart-box{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.recommendations{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.rec{
padding:20px;
border-radius:12px;
color:white;
}

.rec.green{
background:#17A34A;
}

.rec.yellow{
background:#DCA600;
}

.rec.red{
background:#D62828;
}

footer{
background:#00376E;
color:white;
padding:40px;
text-align:center;
margin-top:60px;
}

@media(max-width:768px){

.grid-2{
grid-template-columns:1fr;
}

header h1{
font-size:30px;
}

}
</style>

</head>
<body>

<header>
<h1>ADR 07</h1>
<p>Acompanhamento de Resultado Comercial</p>
</header>

<section class="section">
<div class="container">

<h2 class="title">Indicadores Gerais</h2>

<div class="cards">

<div class="card">
<h3>OP's Julho 2025</h3>
<div class="value">94</div>
</div>

<div class="card">
<h3>OP's Julho 2026</h3>
<div class="value">307</div>
</div>

<div class="card">
<h3>Crescimento</h3>
<div class="value green">226%</div>
</div>

</div>

</div>
</section>

<section class="section">
<div class="container">

<h2 class="title">Leads Gerados em 2026</h2>

<div class="chart-box">
<canvas id="leadsChart"></canvas>
</div>

</div>
</section>

<section class="section">
<div class="container">

<h2 class="title">OP's Ganhas x Perdidas</h2>

<div class="grid-2">

<div class="chart-box">
<canvas id="opChart"></canvas>
</div>

<div class="chart-box">

<h3>Leitura Executiva</h3>

<br>

<p>
O aumento expressivo das oportunidades abertas demonstra o
fortalecimento da geração de demanda e ampliação do pipeline
comercial.
</p>

<br>

<p>
O foco para os próximos ciclos deve estar na velocidade de avanço
das oportunidades e na conversão em receita.
</p>

</div>

</div>

</div>
</section>

<section class="section">
<div class="container">

<h2 class="title">Recomendações Comerciais</h2>

<div class="recommendations">

<div class="rec green">
<h3>🟢 Qualificação</h3>
<p>
Utilizar BANT em 100% dos leads qualificados.
</p>
</div>

<div class="rec yellow">
<h3>🟡 Processo</h3>
<p>
Acompanhar tempo médio de conversão entre etapas.
</p>
</div>

<div class="rec red">
<h3>🔴 Atenção</h3>
<p>
Revisar oportunidades estagnadas há mais de 30 dias.
</p>
</div>

</div>

</div>
</section>

<section class="section">

<div class="container">

<h2 class="title">Frameworks Utilizados</h2>

<div class="grid-2">

<div class="card">

<h3>BANT</h3>

<p><strong>B</strong> Budget</p>
<p><strong>A</strong> Authority</p>
<p><strong>N</strong> Need</p>
<p><strong>T</strong> Timeline</p>

</div>

<div class="card">

<h3>MEDDIC</h3>

<p>M - Metrics</p>
<p>E - Economic Buyer</p>
<p>D - Decision Criteria</p>
<p>D - Decision Process</p>
<p>I - Identify Pain</p>
<p>C - Champion</p>

</div>

</div>

</div>

</section>

<footer>

<h3>Bertolini Sistemas de Armazenagem</h3>

<br>

<p>📞 +55 54 2102 4991</p>

<p>✉ armazenagem@bertolini.com.br</p>

</footer>

<script>

const leads = document.getElementById('leadsChart');

new Chart(leads,{

type:'line',

data:{

labels:[
'Jan',
'Fev',
'Mar',
'Abr',
'Mai',
'Jun',
'Jul'
],

datasets:[{

label:'Leads',

data:[
144,
222,
216,
203,
204,
222,
221
],

borderWidth:3,
borderColor:'#004A93',
backgroundColor:'#60A5FA'
}]
}
});

const op = document.getElementById('opChart');

new Chart(op,{

type:'bar',

data:{

labels:['Ganhas','Perdidas'],

datasets:[{

data:[65,35],

backgroundColor:[
'#1FA95B',
'#D62828'
]

}]
}

});

</script>

</body>
</html>
